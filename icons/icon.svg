<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6F7BE0"/>
      <stop offset=".55" stop-color="#9C8BDA"/>
      <stop offset="1" stop-color="#E9A9B4"/>
    </linearGradient>
    <linearGradient id="page" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#F1F0FB"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#2B2460" flood-opacity=".28"/>
    </filter>
    <clipPath id="clip"><rect width="512" height="512" rx="116"/></clipPath>
  </defs>
  <rect width="512" height="512" rx="116" fill="url(#bg)"/>
  <!-- soft light in the corner -->
  <circle cx="110" cy="96" r="190" fill="#FFFFFF" opacity=".10" clip-path="url(#clip)"/>
  <!-- the planner page -->
  <g filter="url(#sh)">
    <path d="M150 118h168l66 66v196a26 26 0 0 1-26 26H150a26 26 0 0 1-26-26V144a26 26 0 0 1 26-26z" fill="url(#page)"/>
    <path d="M318 118v44a22 22 0 0 0 22 22h44z" fill="#D9D5F4"/>
  </g>
  <!-- ticked line and two text lines -->
  <path d="M168 238l22 22 40-44" fill="none" stroke="#6F7BE0" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="250" y="226" width="94" height="18" rx="9" fill="#C9C3EE"/>
  <rect x="168" y="292" width="176" height="18" rx="9" fill="#DCD8F5"/>
  <rect x="168" y="336" width="120" height="18" rx="9" fill="#DCD8F5"/>
  <!-- AI spark -->
  <path d="M392 300c6 34 18 46 52 52-34 6-46 18-52 52-6-34-18-46-52-52 34-6 46-18 52-52z" fill="#FFE3A3" stroke="#FFFFFF" stroke-width="10" stroke-linejoin="round"/>
</svg>
